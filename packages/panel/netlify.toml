# packages/panel/netlify.toml — deployed four times: A, B, seat1, seat2
#
# DEV VALUES: the Permissions-Policy origin below is the parent's localhost
# dev port (packages/record/src/config/origins.ts PARENT_ORIGIN), not the real
# theboard.app origin. Swap it for the real parent subdomain before the first
# production deploy. This one file is deployed unchanged to all four panel
# sites — the policy only needs to name the parent, not the sibling panels.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Origin-Agent-Cluster = "?1"
    Permissions-Policy = 'tools=(self "http://localhost:8080")'
