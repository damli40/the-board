# packages/record/netlify.toml — site: the parent/record origin
#
# DEV VALUES: the Permissions-Policy origins below are the five localhost dev
# ports from packages/record/src/config/origins.ts, not the real theboard.app
# subdomains. Swap them for the real *.theboard.app origins — in this file and
# in origins.ts — before the first production deploy.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Origin-Agent-Cluster = "?1"
    Permissions-Policy = 'tools=(self "http://localhost:8081" "http://localhost:8082" "http://localhost:8083" "http://localhost:8084")'
